name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Next.js production build
        run: npm run build
        env:
          LOCAL_MODE: "true"
          NEXT_PUBLIC_SITE_URL: "https://climatestories.id"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?pgbouncer=true"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test"
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
          SUPABASE_SECRET_KEY: "dummy-secret-key"
          CLOUDINARY_CLOUD_NAME: "dummy"
          CLOUDINARY_API_KEY: "123456"
          CLOUDINARY_API_SECRET: "dummy"
